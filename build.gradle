plugins {
	id 'dev.architectury.loom' version '1.11.458'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven { url = 'https://maven.aliyun.com/repository/public/' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.minecraftforge.net/' }
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

loom {
	forge {
		mixinConfigs = ["rollercart.mixins.json", "rollercart.client.mixins.json"]
	}
}

sourceSets.main {
	java.srcDir "src/client/java"
	java.exclude "**/CameraMixinForge.java", "**/GameRendererMixin.java", "**/clientmixinconfig/**"
	resources.srcDir "src/client/resources"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
	inputs.property "version", project.version
	exclude "fabric.mod.json"
	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}